[project]
name = "rosstat-flc"
version = "2.0.0"
description = "Tool for format-logistic control of reports sent to RosStat"
authors = [{ name = "Никита Рябинин", email = "ryabinin.ne@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
keywords = [
    "flc",
    "tool",
    "control",
    "processing",
    "report",
    "rosstat",
    "fsgs",
    "format",
    "format-logistic",
    "russian-specific",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "lxml==6.1.1",
    "numpy==2.4.6",
    "multidict==6.7.1",
    "lark[interegular]==1.3.1",
]

[project.urls]
Repository = "https://github.com/WoolenSweater/rosstat-flc"
Changelog = "https://github.com/WoolenSweater/rosstat-flc/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "black==24.10.0",
    "ruff==0.5.7",
]

[tool.hatch.build.targets.sdist]
include = ["rosstat"]

[tool.hatch.build.targets.wheel]
include = ["rosstat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 79

[tool.ruff]
line-length = 79
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
